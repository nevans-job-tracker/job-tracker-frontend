# Job Tracker — nginx site config.
#
# Serves this app's built files and proxies the API on the same origin, which
# is the arrangement decided in KAN-20 (see docs/ARCHITECTURE.md).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/job-tracker
#   sudo ln -s /etc/nginx/sites-available/job-tracker /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set server_name below. Everything else should work unchanged.

server {
    listen 80;
    listen [::]:80;

    # The LAN address or hostname you reach this on. `_` matches anything,
    # which is fine when this is the only site on the machine.
    server_name _;

    root /opt/job-tracker-frontend/dist;
    index index.html;

    # Uploads are not a feature, but request bodies carry pasted job
    # descriptions, which can be long.
    client_max_body_size 2m;

    # --- SPA fallback -------------------------------------------------------
    #
    # DO NOT REMOVE. The app uses client-side routing, so a cold request for
    # /applications/10 — a bookmark, a refresh, a link shared from a phone —
    # asks nginx for a path that has no file on disk. Without this rewrite
    # those deep links 404 in production while working perfectly in the Vite
    # dev server.
    #
    # This cannot be verified by clicking around: navigating from the list to a
    # detail screen is handled by the router in the browser and never reaches
    # nginx. Only a cold load of a deep URL exercises it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API proxy ----------------------------------------------------------
    #
    # The trailing slash on proxy_pass is load-bearing: it strips the /api
    # prefix, so /api/applications arrives at the backend as /applications and
    # the FastAPI routes need no root_path. Removing that slash forwards the
    # prefix intact and every API call 404s.
    #
    # The backend binds 127.0.0.1 (KAN-23), so this is the only route to it.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed filenames from the Vite build are immutable, so they can be cached
    # hard. index.html deliberately is not — it is what points at the current
    # hashes, and a cached copy would keep serving the previous deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
